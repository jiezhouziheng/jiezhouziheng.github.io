<script>
document.addEventListener('DOMContentLoaded', function() {
  var home = document.querySelector('.main-inner.index');
  if (!home) return;

  home.querySelectorAll('.post-block').forEach(function(block) {
    var body = block.querySelector('.post-body');
    if (!body) return;

    var collapsedHeight = 220;
    body.style.setProperty('--home-post-collapse-height', collapsedHeight + 'px');
    block.classList.add('is-collapsible');

    var button = document.createElement('button');
    button.type = 'button';
    button.className = 'btn home-post-toggle';
    button.setAttribute('aria-expanded', 'false');
    button.textContent = '\u5c55\u5f00\u5168\u6587';

    button.addEventListener('click', function() {
      var expanded = block.classList.toggle('is-expanded');
      button.setAttribute('aria-expanded', expanded ? 'true' : 'false');
      button.textContent = expanded ? '\u6536\u8d77' : '\u5c55\u5f00\u5168\u6587';
      if (!expanded) block.scrollIntoView({ block: 'nearest' });
    });

    var footer = block.querySelector('.post-footer');
    if (footer) {
      footer.insertBefore(button, footer.firstChild);
    } else {
      body.insertAdjacentElement('afterend', button);
    }
  });
});
</script>
